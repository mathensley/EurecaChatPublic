<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tutorial Eureca Chat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: caderno quadriculado no topo, bancada de duas colunas (casos e passos / chat simulado) e roteiro em linha do tempo. */
:root {
  --paper: #F2F5F7;
  --surface: #FFFFFF;
  --ink: #13212B;
  --ink-2: #4A5B68;
  --line: #D5DDE3;
  --grid: rgba(19, 33, 43, 0.07);
  --bulb: #F4B400;
  --on-bulb: #241A00;
  --bar: #F2F5F7;
  --pub: #0B7473;
  --pub-bg: #DCF0EF;
  --prof: #B8400A;
  --prof-bg: #FBE4D6;
  --alu: #2547B8;
  --alu-bg: #E0E7FB;
  --on-acc: #FFFFFF;
  --ok: #1B7F4B;
  --ok-bg: #DDF3E6;
  --no: #8A5A5A;
  --no-bg: #F3E6E6;
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D171E; --surface: #14222C; --ink: #E8EFF3; --ink-2: #9FB1BD; --line: #27394A;
    --grid: rgba(255, 255, 255, 0.05); --bar: #0D171E;
    --pub: #4CC9C6; --pub-bg: #123A3B; --prof: #FF9A62; --prof-bg: #43251A; --alu: #8CA6FF; --alu-bg: #1C2850;
    --on-acc: #0D171E; --ok: #62D194; --ok-bg: #143324; --no: #D2A5A5; --no-bg: #3A2323;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D171E; --surface: #14222C; --ink: #E8EFF3; --ink-2: #9FB1BD; --line: #27394A;
  --grid: rgba(255, 255, 255, 0.05); --bar: #0D171E;
  --pub: #4CC9C6; --pub-bg: #123A3B; --prof: #FF9A62; --prof-bg: #43251A; --alu: #8CA6FF; --alu-bg: #1C2850;
  --on-acc: #0D171E; --ok: #62D194; --ok-bg: #143324; --no: #D2A5A5; --no-bg: #3A2323;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.1; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--bulb); outline-offset: 2px; }

[data-p="publico"], [data-role="visitante"] { --acc: var(--pub); --acc-bg: var(--pub-bg); }
[data-p="professor"], [data-role="prof"] { --acc: var(--prof); --acc-bg: var(--prof-bg); }
[data-p="aluno"], [data-role="aluno"] { --acc: var(--alu); --acc-bg: var(--alu-bg); }

.in { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* barra */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); border-bottom: 1px solid var(--line); }
.bar .in { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 16px; padding-block: 10px; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
.bulb { width: 14px; height: 14px; border-radius: 50%; background: var(--bulb); box-shadow: 0 0 0 4px color-mix(in srgb, var(--bulb) 28%, transparent); }
.bar nav { display: flex; gap: 16px; font-size: 0.9rem; }
.bar nav a { color: var(--ink-2); text-decoration: none; padding-block: 4px; }
.bar nav a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }

/* hero */
.hero { position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 28px 28px; -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); pointer-events: none; }
.hero .in { position: relative; padding-block: 48px 36px; }
.kicker { font-family: var(--f-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.hero h1 { font-weight: 800; font-size: clamp(2.3rem, 7vw, 4rem); margin-top: 12px; max-width: 16ch; }
.mark { position: relative; display: inline-block; }
.mark::after { content: ""; position: absolute; left: -2%; right: -2%; bottom: -0.04em; height: 0.16em; background: var(--bulb); border-radius: 3px; transform: rotate(-1.2deg); }
.lede { margin-top: 18px; max-width: 58ch; color: var(--ink-2); font-size: 1.08rem; }
.tiles { margin-top: 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; }
.tile { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 6px; min-width: 0; }
.tile:hover { border-color: var(--acc); }
.tile[aria-pressed="true"] { border-color: var(--acc); background: var(--acc-bg); }
.tile .who { display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.tile .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--acc); flex: none; }
.tile strong { font-family: var(--f-display); font-size: 1.5rem; line-height: 1.1; color: var(--acc); }
.tile span.d { color: var(--ink-2); font-size: 0.92rem; }
.tile .n { font-family: var(--f-mono); font-size: 0.75rem; color: var(--ink-2); }

/* secoes */
section.block { padding-block: 44px; scroll-margin-top: 64px; }
section.block + section.block { border-top: 1px solid var(--line); }
.sec-head { display: grid; gap: 8px; margin-bottom: 24px; max-width: 62ch; }
.sec-head h2 { font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 800; }
.sec-head p { color: var(--ink-2); }

/* bancada */
.bench { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
@media (min-width: 900px) { .bench { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 36px; } .sim { position: sticky; top: 76px; align-self: start; } }
.col { display: grid; gap: 24px; min-width: 0; align-content: start; }
.label { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 8px; display: block; }
.cases { display: grid; gap: 8px; }
.case { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 2px; }
.case:hover { border-color: var(--acc); }
.case[aria-pressed="true"] { border-color: var(--acc); background: var(--acc-bg); }
.case b { font-weight: 600; }
.case span { color: var(--ink-2); font-size: 0.9rem; }

.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.step { width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 10px 8px; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; }
.step:hover { background: color-mix(in srgb, var(--acc) 8%, transparent); }
.step .num { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-family: var(--f-mono); font-size: 0.8rem; color: var(--ink-2); }
.step[data-state="done"] .num { background: var(--acc-bg); border-color: var(--acc); color: var(--acc); }
.step[data-state="active"] .num { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
.step .tt { font-weight: 600; padding-top: 3px; }
.step[data-state="todo"] .tt { color: var(--ink-2); font-weight: 500; }
.step .more { display: grid; gap: 8px; margin-top: 6px; font-size: 0.95rem; color: var(--ink-2); }
.onde { font-family: var(--f-mono); font-size: 0.78rem; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; color: var(--ink); width: fit-content; max-width: 100%; overflow-wrap: anywhere; }

.ctrl { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 16px; font-weight: 500; font-size: 0.95rem; }
.btn:hover:not(:disabled) { border-color: var(--ink-2); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--acc, var(--ink)); border-color: var(--acc, var(--ink)); color: var(--on-acc); font-weight: 600; }

/* chat simulado */
.chat { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.chat-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.chat-head .ch { font-family: var(--f-mono); font-weight: 500; font-size: 0.95rem; overflow-wrap: anywhere; }
.chat-head .ctx { font-size: 0.8rem; color: var(--ink-2); }
.tag { font-family: var(--f-mono); font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; background: var(--bulb); color: var(--on-bulb); border-radius: 4px; padding: 2px 7px; }
.chat-body { height: 440px; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; background-image: linear-gradient(var(--grid) 1px, transparent 1px); background-size: 100% 28px; }
.msg { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; animation: rise 0.25s ease-out both; }
.av { width: 34px; height: 34px; border-radius: 50%; background: var(--acc-bg); color: var(--acc); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 0.95rem; }
.mh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.mh strong { font-size: 0.92rem; color: var(--acc); }
.mh .role { font-family: var(--f-mono); font-size: 0.66rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.mh time { font-family: var(--f-mono); font-size: 0.72rem; color: var(--ink-2); }
.msg p { overflow-wrap: anywhere; }
.sys { text-align: center; font-size: 0.84rem; color: var(--ink-2); display: flex; align-items: center; gap: 12px; animation: rise 0.25s ease-out both; }
.sys::before, .sys::after { content: ""; height: 1px; background: var(--line); flex: 1; }
.sys span { max-width: 36ch; }
.att { margin-top: 6px; display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 8px 10px; width: fit-content; max-width: 100%; }
.att .ext { font-family: var(--f-mono); font-size: 0.68rem; font-weight: 500; background: var(--acc-bg); color: var(--acc); border-radius: 4px; padding: 3px 6px; flex: none; }
.att .fn { font-family: var(--f-mono); font-size: 0.82rem; overflow-wrap: anywhere; min-width: 0; }
.att .sz { font-size: 0.78rem; color: var(--ink-2); white-space: nowrap; }
.poll { margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); padding: 12px; display: grid; gap: 10px; }
.poll .q { font-weight: 600; }
.poll ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.poll li { display: grid; gap: 4px; font-size: 0.9rem; }
.poll .row { display: flex; justify-content: space-between; gap: 12px; }
.poll .row span:last-child { font-family: var(--f-mono); font-size: 0.8rem; color: var(--ink-2); white-space: nowrap; }
.poll .track { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.poll .fill { height: 100%; background: var(--alu); border-radius: 4px; transition: width 0.6s ease-out; }
.poll li[data-mine="1"] .row span:first-child { font-weight: 600; }
.poll li[data-top="1"] .fill { background: var(--ok); }
.poll .foot { font-size: 0.78rem; color: var(--ink-2); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .msg, .sys { animation: none; } .poll .fill { transition: none; } }

/* matriz */
.scroll-x { overflow-x: auto; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 560px; }
th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 0.95rem; }
tr:last-child td { border-bottom: 0; }
th { font-family: var(--f-mono); font-size: 0.74rem; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500; }
th[data-p] { color: var(--acc); }
td.c { width: 1%; white-space: nowrap; }
.pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 0.8rem; font-weight: 500; }
.pill[data-v="sim"] { background: var(--ok-bg); color: var(--ok); }
.pill[data-v="nao"] { background: var(--no-bg); color: var(--no); }
.pill[data-v="leitura"] { background: var(--bulb); color: var(--on-bulb); }

/* video */
.vgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
@media (min-width: 900px) { .vgrid { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); } }
.poster { aspect-ratio: 16 / 9; max-width: 100%; border: 1.5px solid var(--line); border-radius: 12px; background-color: var(--surface); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; display: grid; place-items: center; text-align: center; padding: 16px; }
.poster .inner { display: grid; gap: 10px; justify-items: center; }
.poster .len { font-family: var(--f-display); font-weight: 800; font-size: clamp(2rem, 6vw, 3rem); line-height: 1; }
.play { width: 52px; height: 52px; border-radius: 50%; background: var(--bulb); display: grid; place-items: center; }
.play::before { content: ""; border-left: 16px solid var(--on-bulb); border-top: 10px solid transparent; border-bottom: 10px solid transparent; margin-left: 4px; }
.poster a { color: inherit; }
.tline { display: flex; gap: 3px; margin-top: 16px; }
.tline i { font-style: normal; height: 30px; border-radius: 5px; background: var(--acc-bg); color: var(--acc); display: grid; place-items: center; font-family: var(--f-mono); font-size: 0.72rem; min-width: 0; }
.tline i[data-p="geral"] { --acc: var(--ink-2); --acc-bg: var(--line); }
.tl-scale { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 0.72rem; color: var(--ink-2); margin-top: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 14px; font-size: 0.85rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend b { width: 10px; height: 10px; border-radius: 3px; background: var(--acc); display: inline-block; }
.scenes { display: grid; gap: 8px; }
details.scene { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; }
details.scene[open] { border-color: var(--acc); }
details.scene summary { list-style: none; cursor: pointer; padding: 12px 14px; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
details.scene summary::-webkit-details-marker { display: none; }
details.scene .num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--acc-bg); color: var(--acc); font-family: var(--f-mono); font-size: 0.8rem; }
details.scene .tm { font-family: var(--f-mono); font-size: 0.78rem; color: var(--ink-2); white-space: nowrap; }
details.scene .body { padding: 0 14px 16px 54px; display: grid; gap: 12px; font-size: 0.95rem; }
details.scene dt { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
details.scene dd { margin: 2px 0 0; }
.speech { font-style: italic; }
.copybox { margin-top: 16px; display: grid; gap: 10px; }
.copybox textarea { width: 100%; min-height: 180px; font-family: var(--f-mono); font-size: 0.8rem; background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); border-radius: 8px; padding: 10px; }

footer { border-top: 1px solid var(--line); }
footer .in { padding-block: 28px 40px; color: var(--ink-2); font-size: 0.9rem; max-width: 1120px; }
</style>

<div id="root"></div>

          <span className="label">Passo a passo</span>
          <ol className="steps">
            ${c.steps.map(function (s, i) {
              var state = i < step ? 'done' : i === step ? 'active' : 'todo';
              return html`<li key=${c.id + i}>
                <button className="step" data-state=${state} aria-current=${i === step ? 'step' : undefined} onClick=${function () { props.onStep(i); }}>
                  <span className="num">${i + 1}</span>
                  <span>
                    <span className="tt">${s.t}</span>
                    ${i === step ? html`<span className="more"><span>${s.d}</span><span className="onde">${s.onde}</span></span>` : null}
                  </span>
                </button>
              </li>`;
            })}
          </ol>
        </div>
        <div className="ctrl">
          <button className="btn" disabled=${step === 0} onClick=${function () { props.onStep(step - 1); }}>Passo anterior</button>
          <button className="btn primary" disabled=${step === last} onClick=${function () { props.onStep(step + 1); }}>Próximo passo</button>
          <button className="btn" onClick=${function () { props.onStep(0); }}>Reiniciar</button>
        </div>
      </div>
      <div className="sim"><${Simulator} c=${c} step=${step} /></div>
    </div>`;
  }

  function Matriz() {
    return html`<div className="scroll-x">
      <table>
        <thead><tr>
          <th scope="col">Ação</th>
          <th scope="col" data-p="publico">Público</th>
          <th scope="col" data-p="aluno">Aluno</th>
          <th scope="col" data-p="professor">Professor</th>
        </tr></thead>
        <tbody>
          ${MATRIZ.map(function (r, i) {
            return html`<tr key=${i}>
              <td>${r[0]}</td>
              ${[1, 2, 3].map(function (j) { return html`<td className="c" key=${j}><span className="pill" data-v=${r[j]}>${VLABEL[r[j]]}</span></td>`; })}
            </tr>`;
          })}
        </tbody>
      </table>
    </div>`;
  }

  function Video() {
    var total = CENAS.reduce(function (a, c) { return a + c.s; }, 0);
    var _r = useState(null), raw = _r[0], setRaw = _r[1];
    var _k = useState(false), copied = _k[0], setCopied = _k[1];
    var starts = [], acc = 0;
    CENAS.forEach(function (c) { starts.push(acc); acc += c.s; });
    var taRef = useRef(null);

    function copiar() {
      var txt = roteiroTexto();
      var done = function () { setCopied(true); setRaw(null); setTimeout(function () { setCopied(false); }, 2000); };
      var fail = function () { setRaw(txt); };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fail);
        else fail();
      } catch (e) { fail(); }
    }
    useEffect(function () { if (raw && taRef.current) { taRef.current.focus(); taRef.current.select(); } }, [raw]);

    return html`<div className="vgrid">
      <div>
        <div className="poster">
          <div className="inner">
            <div className="play" aria-hidden="true"></div>
            <div className="len">${mmss(total)}</div>
            ${VIDEO_URL
              ? html`<a className="btn primary" style=${{ '--acc': 'var(--ink)', textDecoration: 'none' }} href=${VIDEO_URL} target="_blank" rel="noopener">Assistir ao vídeo</a>`
              : html`<span className="kicker">Vídeo em produção · roteiro ao lado</span>`}
          </div>
        </div>
        <div className="tline" role="img" aria-label="Linha do tempo das cenas">
          ${CENAS.map(function (c, i) {
            return html`<i key=${i} data-p=${c.p} style=${{ flex: c.s + ' 1 0' }} title=${c.t}>${i + 1}</i>`;
          })}
        </div>
        <div className="tl-scale"><span>0:00</span><span>${mmss(Math.round(total / 2))}</span><span>${mmss(total)}</span></div>
        <div className="legend">
          ${['geral', 'publico', 'professor', 'aluno'].map(function (k) {
            return html`<span key=${k} data-p=${k === 'geral' ? undefined : k} style=${k === 'geral' ? { '--acc': 'var(--ink-2)' } : undefined}><b></b>${PNOME[k]}</span>`;
          })}
        </div>
        <div className="copybox">
          <div className="ctrl"><button className="btn" onClick=${copiar}>${copied ? 'Roteiro copiado' : 'Copiar roteiro completo'}</button></div>
          ${raw ? html`<div><span className="label">Selecione e copie o texto abaixo</span><textarea ref=${taRef} readOnly value=${raw} aria-label="Roteiro completo"></textarea></div>` : null}
        </div>
      </div>
      <div className="scenes">
        ${CENAS.map(function (c, i) {
          return html`<details className="scene" key=${i} data-p=${c.p === 'geral' ? undefined : c.p} style=${c.p === 'geral' ? { '--acc': 'var(--ink-2)', '--acc-bg': 'var(--line)' } : undefined}>
            <summary>
              <span className="num">${i + 1}</span>
              <b>${c.t}</b>
              <span className="tm">${mmss(starts[i])} · ${c.s}s</span>
            </summary>
            <div className="body">
              <dl style=${{ margin: 0, display: 'grid', gap: '12px' }}>
                <div><dt>O que gravar</dt><dd>${c.tela}</dd></div>
                <div><dt>Narração</dt><dd className="speech">${c.fala}</dd></div>
                <div><dt>Dica de gravação</dt><dd>${c.dica}</dd></div>
              </dl>
            </div>
          </details>`;
        })}
      </div>
    </div>`;
  }

  function App() {
    var initial = 'publico';
    try {
      var h = (location.hash || '').slice(1);
      if (PERFIS.some(function (p) { return p.id === h; })) initial = h;
    } catch (e) {}
    var _p = useState(initial), pid = _p[0], setPid = _p[1];
    var perfil = PERFIS.filter(function (p) { return p.id === pid; })[0];
    var _c = useState(perfil.cases[0].id), caseId = _c[0], setCaseId = _c[1];
    var _s = useState(0), step = _s[0], setStep = _s[1];

    function escolherPerfil(id) {
      var p = PERFIS.filter(function (x) { return x.id === id; })[0];
      setPid(id); setCaseId(p.cases[0].id); setStep(0);
    }
    function escolherCaso(id) { setCaseId(id); setStep(0); }

    return html`<${React.Fragment}>
      <header className="bar"><div className="in">
        <div className="brand"><span className="bulb" aria-hidden="true"></span>Eureca Chat</div>
        <nav aria-label="Seções">
          <a href="#perfis">Perfis</a>
          <a href="#permissoes">Permissões</a>
          <a href="#video">Vídeo</a>
        </nav>
      </div></header>

      <main>
        <section className="hero"><div className="in">
          <div className="kicker">Tutorial de uso · 3 perfis · 11 exemplos</div>
          <h1>Eureca Chat <span className="mark">na prática</span></h1>
          <p className="lede">Veja como visitantes, professores e alunos usam o chat da turma. Cada exemplo traz uma conversa de simulação e o passo a passo para você repetir no sistema.</p>
          <div className="tiles" role="group" aria-label="Escolha um perfil">
            ${PERFIS.map(function (p) {
              return html`<button key=${p.id} className="tile" data-p=${p.id} aria-pressed=${p.id === pid} onClick=${function () { escolherPerfil(p.id); }}>
                <span className="who"><span className="dot"></span>${p.quem}</span>
                <strong>${p.nome}</strong>
                <span className="d">${p.resumo}</span>
                <span className="n">${p.cases.length} exemplos</span>
              </button>`;
            })}
          </div>
        </div></section>

        <section className="block" id="perfis"><div className="in">
          <div className="sec-head">
            <span className="kicker">Perfil: ${perfil.nome}</span>
            <h2>Exemplos para quem usa como ${perfil.nome.toLowerCase()}</h2>
            <p>Escolha um exemplo, avance pelos passos e acompanhe a conversa se formando ao lado.</p>
          </div>
          <${Workbench} perfil=${perfil} caseId=${caseId} step=${step} onCase=${escolherCaso} onStep=${setStep} />
        </div></section>

        <section className="block" id="permissoes"><div className="in">
          <div className="sec-head">
            <span className="kicker">Comparativo</span>
            <h2>O que cada perfil pode fazer</h2>
            <p>Use a tabela para decidir com qual perfil entrar e o que esperar de cada um.</p>
          </div>
          <${Matriz} />
        </div></section>

        <section className="block" id="video"><div className="in">
          <div className="sec-head">
            <span className="kicker">Vídeo tutorial geral</span>
            <h2>Roteiro cena a cena</h2>
            <p>Oito cenas, quatro minutos e quarenta e cinco segundos, passando pelos três perfis. Abra cada cena para ver o que gravar, a narração e uma dica.</p>
          </div>
          <${Video} />
        </div></section>
      </main>

      <footer><div className="in">
        Exemplos ilustrativos. Nomes de telas, botões e permissões podem variar conforme a configuração da sua escola.
      </div></footer>
    <//>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>

</body></html>
