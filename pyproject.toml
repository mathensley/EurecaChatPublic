[project]
name = "eureca-ai"
version = "0.1.0"
description = "EurecaAI backend"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiohttp==3.14.1",
    "arize-phoenix-otel==0.16.1",
    "asyncpg==0.31.0",
    "duckdb==1.5.4",
    "eventlet==0.41.0",
    "google-api-python-client==2.198.0",
    "google-auth==2.55.1",
    "google-auth-httplib2==0.4.0",
    "google-auth-oauthlib==1.4.0",
    "great-expectations==1.18.2",
    "hypercorn==0.18.0",
    "ipython==9.15.0",
    "langchain==1.3.11",
    "langchain-core==1.4.8",
    "langchain-google-genai==4.2.6",
    "langchain-mcp-adapters==0.3.0",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.3.3",
    "langgraph==1.2.6",
    "langgraph-checkpoint==4.1.1",
    "langgraph-checkpoint-postgres==3.1.0",
    "matplotlib==3.11.1",
    "microsandbox==0.7.2; sys_platform == 'linux'",
    "openinference-instrumentation==0.1.53",
    "openinference-instrumentation-langchain==0.1.66",
    "openinference-instrumentation-openai==0.1.52",
    "opentelemetry-api==1.43.0",
    "opentelemetry-exporter-otlp==1.43.0",
    "opentelemetry-sdk==1.43.0",
    "pandas==3.0.3",
    "pillow==12.3.0",
    "psycopg==3.3.4",
    "psycopg-pool==3.3.1",
    "pydub==0.25.1",
    "prometheus-client==0.24.1",
    "pymupdf==1.27.2.3",
    "python-dotenv==1.2.2",
    "python-json-logger==4.1.0",
    "python-socketio==5.16.3",
    "quart==0.20.0",
    "quart-cors==0.8.0",
    "rapidfuzz==3.14.5",
    "reportlab==5.0.1",
    "rich==15.0.0",
    "speechrecognition==3.17.0",
    "sql-metadata==2.20.0",
    "sqlglot==30.11.0",
    "tabulate>=0.9.0",
    "tavily-python==0.7.26",
]

[project.optional-dependencies]
wasmer = ["wasmer-sdk==0.3.0; sys_platform == 'linux' or sys_platform == 'darwin'"]

[tool.eurecachat]
release-stage = "beta"

[tool.uv]
package = false
